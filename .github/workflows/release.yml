name: Release

# Publish a GitHub Release with a tag like v1.0.0 (or push the tag):
# builds the Chrome and Firefox zips and attaches them to the release.
on:
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the manifest version
        run: |
          V=$(python3 -c "import json;print(json.load(open('extension/manifest.json'))['version'])")
          [ "v$V" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME ≠ manifest v$V"; exit 1; }

      - name: Build zips
        run: ./scripts/pack.sh

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip --title "Lampyris $GITHUB_REF_NAME" \
              --notes "Download **lampyris-*-chrome.zip** for Chrome/Edge/Brave/Opera or **lampyris-*-firefox.zip** for Firefox. See the README for install steps."
          fi
